# Central Stonecutter properties for RestrictedCrafting.
# Top-level keys apply to every node; [<loader>."<version>"] sections apply to that node only.
# Build scripts read these via property("...") after calling properties.tags(version, loader).

# Mod
mod_name = "Restricted Crafting"
mod_id = "restricted-crafting"
mod_version = "1.0.1"

# Shared dependencies
# LuckPerms platform-agnostic API (compileOnly; provided at runtime by the LuckPerms mod).
#   https://repo.papermc.io / maven central: net.luckperms:api
luckperms_version = "5.4"
# MixinExtras (bundled on NeoForge; already shipped by fabric-loader on Fabric).
mixinextras_version = "0.5.4"

# ---------------------------------------------------------------------------
# Fabric
#   loader / fabric-api    https://fabricmc.net/develop/
# ---------------------------------------------------------------------------

[fabric."1.21"]
minecraft_version = "1.21"
java_version = "21"
loader_version = "0.19.3"
fabric_version = "0.100.1+1.21"
display_name = "[1.21, 1.21.1]"
supported_versions = "1.21,1.21.1"
supported_minecraft_version = ">=1.21- <1.21.2"

[fabric."1.21.2"]
minecraft_version = "1.21.2"
java_version = "21"
loader_version = "0.19.3"
fabric_version = "0.107.0+1.21.3"
display_name = "[1.21.2 - 1.21.10]"
supported_versions = "1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10"
supported_minecraft_version = ">=1.21.2- <1.21.11"

[fabric."1.21.11"]
minecraft_version = "1.21.11"
java_version = "21"
loader_version = "0.19.3"
fabric_version = "0.139.4+1.21.11"
display_name = "[1.21.11]"
supported_versions = "1.21.11"
supported_minecraft_version = ">=1.21.11- <26.1"

[fabric."26.1"]
minecraft_version = "26.1"
java_version = "25"
loader_version = "0.19.5"
fabric_version = "0.144.3+26.1"
display_name = "[26.1 - 26.3]"
supported_versions = "26.1,26.1.1,26.1.2,26.2,26.3"
supported_minecraft_version = ">=26.1"

# ---------------------------------------------------------------------------
# NeoForge
#   neoforge_version  https://projects.neoforged.net/neoforged/neoforge
# ---------------------------------------------------------------------------

[neoforge."1.21"]
minecraft_version = "1.21"
java_version = "21"
neoforge_version = "21.0.167"
display_name = "[NeoForge 1.21, 1.21.1]"
supported_versions = "1.21,1.21.1"
supported_minecraft_version = "[1.21,1.21.2)"

[neoforge."1.21.2"]
minecraft_version = "1.21.2"
java_version = "21"
neoforge_version = "21.2.1-beta"
