modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/NikitaCartes/restricted-crafting/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/NikitaCartes/restricted-crafting"
authors = "NikitaCartes"
description = '''
Permission-based crafting restrictions via LuckPerms.
'''
side = "SERVER"

[[mixins]]
config = "restricted-crafting.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${supported_minecraft_version}"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "luckperms"
type = "required"
versionRange = "[5,)"
ordering = "AFTER"
side = "SERVER"
